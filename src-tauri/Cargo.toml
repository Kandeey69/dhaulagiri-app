[package]
name = "easysolution"
version = "0.1.1"
description = "Local desktop app for sales, receivables, purchase and payable workflow"
authors = ["Easysolution"]
edition = "2021"

[lib]
name = "easysolution_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
